name: Probar WhatsApp

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probar:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Enviar mensaje de prueba
        env:
          CALLMEBOT_DESTINOS: ${{ secrets.CALLMEBOT_DESTINOS }}
        run: node scripts/avisar.mjs --prueba
