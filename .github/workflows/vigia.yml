name: Vigía de datos

# Falla si los datos publicados se atrasan. GitHub avisa por correo cuando este workflow falla.

on:
  schedule:
    - cron: '35 * * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  revisar:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22

      - name: Revisar los datos publicados
        run: node scripts/vigia.mjs
