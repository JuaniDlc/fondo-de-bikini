name: Historial de nubes bajas

# Nubes bajas (canales 3, 7, 13 y 15 de GOES) cerca de Guayaquil, un mes por trabajo, para
# probarlos en el modelo corregido (analisis/nubes_bajas_historial.py). Solo se corre a mano; los resultados quedan
# como artefactos del workflow, no se guardan en el repositorio.

on:
  workflow_dispatch:
    inputs:
      desde:
        description: Primer mes (AAAA-MM)
        default: '2023-01'
      hasta:
        description: Último mes (AAAA-MM)
        default: '2026-10'

permissions:
  contents: read

jobs:
  meses:
    runs-on: ubuntu-latest
    outputs:
      lista: ${{ steps.lista.outputs.lista }}
    steps:
      - id: lista
        shell: python
        env:
          DESDE: ${{ inputs.desde }}
          HASTA: ${{ inputs.hasta }}
        run: |
          import json, os
          a, m = map(int, os.environ['DESDE'].split('-'))
          fin = tuple(map(int, os.environ['HASTA'].split('-')))
          meses = []
          while (a, m) <= fin:
              meses.append(f'{a}-{m:02d}')
              a, m = (a + 1, 1) if m == 12 else (a, m + 1)
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write(f'lista={json.dumps(meses)}\n')

  mes:
    needs: meses
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      max-parallel: 12
      matrix:
        mes: ${{ fromJson(needs.meses.outputs.lista) }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: scripts/requirements-rayos.txt

      - name: Nubes bajas de ${{ matrix.mes }}
        run: |
          pip install -q -r scripts/requirements-rayos.txt
          python analisis/nubes_bajas_historial.py ${{ matrix.mes }} salida

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: nubes-bajas-${{ matrix.mes }}
          path: salida/
          retention-days: 30
