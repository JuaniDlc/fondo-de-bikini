name: Rayos

on:
  schedule:
    - cron: '*/10 * * * *' # cada 10 minutos
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rayos
  cancel-in-progress: true

jobs:
  rayos:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    outputs:
      guardado: ${{ steps.guardar.outputs.guardado }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Datos (rama datos, en data/)
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: datos
          path: data

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: scripts/requirements-rayos.txt

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22

      - name: Rayos cerca de Guayaquil (satélite GOES-19)
        id: rayos
        env:
          LUGARES: ${{ secrets.LUGARES }}
          LUGARES_SALIDA: ${{ runner.temp }}/lugares-rayos.json
        run: |
          pip install -q -r scripts/requirements-rayos.txt
          python scripts/rayos.py

      - name: Nubes de tormenta (infrarrojo de GOES-19)
        continue-on-error: true
        env:
          LUGARES: ${{ secrets.LUGARES }}
          LUGARES_IR: ${{ runner.temp }}/lugares-ir.json
        run: python scripts/infrarrojo.py

      - name: Reportes del aeropuerto
        continue-on-error: true
        run: node scripts/aeropuerto.mjs

      - name: Pronóstico por lugar
        continue-on-error: true
        env:
          LUGARES_SALIDA: ${{ runner.temp }}/lugares-rayos.json
          LUGARES_IR: ${{ runner.temp }}/lugares-ir.json
        run: node scripts/lugares.mjs

      - name: Avisar por Telegram y WhatsApp
        env:
          CALLMEBOT_DESTINOS: ${{ secrets.CALLMEBOT_DESTINOS }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT: ${{ secrets.TELEGRAM_CHAT }}
        run: node scripts/avisar.mjs

      # Solo se guarda algo cuando cambia el estado de los avisos, el reporte del aeropuerto o los
      # rayos que usa el modelo (o empieza otra hora), para no hacer un commit cada 10 minutos.
      - name: Commit si cambió un aviso, el aeropuerto o los rayos
        id: guardar
        working-directory: data
        env:
          GUARDAR_RAYOS: ${{ steps.rayos.outputs.guardar }}
        run: |
          if [ "$GUARDAR_RAYOS" != "si" ] && [ -z "$(git status --porcelain alertas.json aeropuerto.json lugares.json infrarrojo.json)" ]; then
            echo "Sin cambios en los avisos, el aeropuerto ni los rayos"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add alertas.json rayos.json
          for f in aeropuerto.json lugares.json infrarrojo.json; do if [ -f "$f" ]; then git add "$f"; fi; done
          git commit -m "Rayos y aeropuerto $(TZ=America/Guayaquil date '+%Y-%m-%d %H:%M')"
          # Si otro workflow guardó los mismos archivos, gana esta versión (la más reciente).
          for i in 1 2 3; do git pull --rebase -X theirs && git push && { echo "guardado=si" >> "$GITHUB_OUTPUT"; exit 0; }; git rebase --abort 2>/dev/null; sleep 5; done
          exit 1

  publicar:
    needs: rayos
    if: needs.rayos.outputs.guardado == 'si'
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/publicar.yml
