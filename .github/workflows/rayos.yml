name: Rayos

on:
  schedule:
    - cron: '*/10 * * * *' # cada 10 minutos
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rayos
  cancel-in-progress: true

jobs:
  rayos:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: scripts/requirements-rayos.txt

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Rayos cerca de Guayaquil (satélite GOES-19)
        id: rayos
        run: |
          pip install -q -r scripts/requirements-rayos.txt
          python scripts/rayos.py

      - name: Avisar por Telegram y WhatsApp
        env:
          CALLMEBOT_DESTINOS: ${{ secrets.CALLMEBOT_DESTINOS }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT: ${{ secrets.TELEGRAM_CHAT }}
        run: node scripts/avisar.mjs

      # Solo se guarda algo cuando cambia el estado de los avisos o los rayos que usa el modelo
      # (o empieza otra hora), para no hacer un commit cada 10 minutos.
      - name: Commit si cambió un aviso o los rayos
        env:
          GUARDAR_RAYOS: ${{ steps.rayos.outputs.guardar }}
        run: |
          if [ "$GUARDAR_RAYOS" != "si" ] && git diff --quiet data/alertas.json 2>/dev/null && git ls-files --error-unmatch data/alertas.json >/dev/null 2>&1; then
            echo "Sin cambios en los avisos ni en los rayos"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/alertas.json data/rayos.json
          git commit -m "Rayos $(TZ=America/Guayaquil date '+%Y-%m-%d %H:%M')"
          # Si otro workflow guardó los mismos archivos, gana esta versión (la más reciente).
          for i in 1 2 3; do git pull --rebase -X theirs && git push && exit 0; git rebase --abort 2>/dev/null; sleep 5; done
          exit 1
